
services:
  postgres:
    image: postgres:17
    container_name: adaptive-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adaptive_tutor
      POSTGRES_USER: tutor_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_admin -d adaptive_tutor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: